# ============================================================================
# 公共基础配置（所有 profile 生效）
# 密钥类配置一律经环境变量注入，禁止明文落盘（BR-20 / NFR-SE-03 / 8.7）
# ============================================================================
spring:
  application:
    name: clawbot
  profiles:
    # 默认以 local 启动（Mock 全开、占位符仅告警）；prod 下占位符缺失即 Fail-Fast
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    lazy-initialization: false
  jackson:
    # 时间统一 ISO 8601 带时区，DB/容器统一 Asia/Shanghai（8.4 / NFR-RE-09）
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    # 关闭 Spring 默认 problemdetail，统一走 ApiResponse（G-08）
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clawbot}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: clawbot-hikari
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  flyway:
    enabled: true
    # 迁移脚本按 sys_/wx_/biz_/log_ 域分文件（3.5 / G-06）
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    table: flyway_schema_history
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    # 微信回调为被动应答，按万级用户规模保守配置
    threads:
      max: 200
      min-spare: 10

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lumensteward.clawbot.infrastructure.persistence.entity
  configuration:
    map-underscore-to-camel-case: true
    # 禁止在日志中打印完整 SQL 参数（G-13：不泄露 SQL）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      # 逻辑删除与 deleted_at 语义一致（7.6.2）
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 后台跨域白名单（本地前端开发服务器默认 5173；生产由 Nginx 同域代理）
clawbot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.lumensteward.clawbot: INFO
