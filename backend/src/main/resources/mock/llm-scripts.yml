# ============================================================================
# Mock LLM 可编程脚本（T03 / AC-D1 / 供 T04 TC-H 反幻觉专项使用）
# 由 MockLlmClient 加载；按「轮次 + 最近一条 user 消息子串」确定性返回，
# 可注入 tool_calls / 终态文本 / 失败（TIMEOUT|UNAVAILABLE|PROTOCOL）/ token 计量。
# 说明：round 以「消息序列中带 toolCalls 的 assistant 消息数量」推定。
# ----------------------------------------------------------------------------
# usage / defaultUsage：模拟 provider 回报的 token 计量（B-4 / 手册 §2.25）。
# 此前 Mock 恒回报 0 token，导致「计量在转」这一事实在本机根本无法取证；声明后
# 每次调用都会写 log_llm_call 一行并累加日预算桶，两者数值须可比对。
# 数值取接近真实的量级（编排轮含系统提示 + 工具 Schema + 状态库注入块）。
# ============================================================================
defaultContent: "（Mock）我在呢，随时听你说～"
defaultFinishReason: stop
defaultUsage:
  prompt: 520
  completion: 60

rules:
  # ---- 个人状态库生长（W6）：抽取器请求的载荷以【记忆抽取】开头，必须置于首位 ----
  # 置于首位的原因：载荷内嵌用户原文，若排在后面会被 pet-create-toolcall 等
  # 关键词规则（如「叫」）抢先命中，导致抽取拿到的不是 JSON。
  - name: memory-extract
    round: 0
    match: "【记忆抽取】"
    finishReason: stop
    usage:
      prompt: 410
      completion: 85
    content: '{"items":[{"kind":"PERSON","name":"妈妈","content":"住在北京，喜欢喝绿茶","confidence":0.8},{"kind":"PREFERENCE","name":"饮品","content":"偏好无糖茶饮","confidence":0.7}]}'

  # ---- FR-23 示例插件 query_weather：运行期取证入口（见手册 §7.14） ----
  # 除本条与下面一条「规则数据」外，新增该工具未改动任何既有文件：
  # 编排器只认注册表，Prompt 由 enabledSchemas 动态下发，故对话引擎与 Prompt 文件零改动。
  # 匹配词刻意用「查天气」而非「天气」：后者会抢走 W6 用例的「今天天气怎么样」默认回复。
  - name: weather-toolcall
    round: 0
    match: "查天气"
    finishReason: tool_calls
    usage:
      prompt: 640
      completion: 40
    toolCalls:
      - id: mock-call-weather
        type: function
        name: query_weather
        arguments: '{"city":"杭州"}'

  # 必须排在 pet-after-tool 之前：同为 round 1，先匹配者命中
  - name: weather-after-tool
    round: 1
    match: "查天气"
    finishReason: stop
    usage:
      prompt: 780
      completion: 55
    content: "杭州今天晴，26℃（演示数据集样例，非真实预报）。"

  # ---- W11 识图缓存与追问续接：图片消息路由 + ask_image 追问（见手册 §7.17） ----
  # 图片消息由 ImageMessageHandler 合成为「（用户发来一张图片，链接：…）」进入编排，
  # 模型调用 recognize_image 识别，结论写入识图缓存；追问经 ask_image 免重发图片续接。
  # ask_image 仅在缓存存在时出现在函数 Schema（W10 visibleIn）——Mock 会校验工具在
  # 下发集内才发起调用，故「无缓存时追问」自然回落默认文案（负证路径）。
  - name: image-recognize-toolcall
    round: 0
    match: "（用户发来一张图片"
    finishReason: tool_calls
    usage:
      prompt: 660
      completion: 40
    toolCalls:
      - id: mock-call-recognize-image
        type: function
        name: recognize_image
        arguments: '{"scene":"pet","image_url":"from-message"}'

  - name: ask-image-toolcall
    round: 0
    match: "它大概多大了"
    finishReason: tool_calls
    usage:
      prompt: 640
      completion: 35
    toolCalls:
      - id: mock-call-ask-image
        type: function
        name: ask_image
        arguments: '{"question":"它大概多大了"}'

  # round 1 带 match 的规则都必须在 pet-after-tool（无 match 兜底）之前
  - name: image-after-recognize
    round: 1
    match: "（用户发来一张图片"
    finishReason: stop
    usage:
      prompt: 800
      completion: 55
    content: "（Mock）看过了，是一只橘色的成年短毛猫，毛色干净，体态圆润。想问它什么尽管问～"

  - name: ask-image-after-tool
    round: 1
    match: "它大概多大了"
    finishReason: stop
    usage:
      prompt: 820
      completion: 60
    content: "（Mock）从图片看，这只橘猫大约 2 岁（基于刚才识别的缓存信息）。"

  # ---- W19 单人桌游：大厅开局 + 三类对局的回合流程（见手册 §7.19） ----
  # game_lobby 恒可见（开局/关局/列表）；turtle_soup / code_break / life_sim 仅在
  # 对局进行中出现在函数 Schema（W10 会话门控）。
  # 轮次口径（W19 实测澄清）：round 的推定基于「编排器本轮消息序列」，而工具调用的
  # assistant 消息不跨用户回合持久化进上下文 ⇒ 每个新用户回合都从 round 0 重新开始
  # （同一 W11 的 ask-image-toolcall 也是 round 0 规则却在第二回合适中）。故每条指令词
  # 配两条规则：round 0 发起工具调用、round 1（工具结果回来后）给出终态回复；
  # 9 组 match 词互不重叠，且必须排在 pet-after-tool（round 1 无 match 兜底）之前。
  # 刻意避开「已查询/已记录/已生成」等完成态动词（BR-04 动作声明词表），防止 Mock
  # 文案被一致性校验误判为执行性幻觉。

  # 海龟汤（openid_w19_soup：开局 → 提示 → 猜中）
  - name: w19-lobby-soup
    round: 0
    match: "海龟汤"
    finishReason: tool_calls
    usage:
      prompt: 660
      completion: 40
    toolCalls:
      - id: mock-call-lobby-soup
        type: function
        name: game_lobby
        arguments: '{"action":"start","game":"turtle_soup"}'

  - name: w19-soup-intro
    round: 1
    match: "海龟汤"
    finishReason: stop
    usage:
      prompt: 880
      completion: 70
    content: "（Mock）海龟汤开局！汤面在工具结果里，请先把它讲给玩家，引导他用是非问题逼近真相；汤底是你我的秘密，猜不中别说出来。"

  - name: w19-soup-hint
    round: 0
    match: "给个提示"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 35
    toolCalls:
      - id: mock-call-soup-hint
        type: function
        name: turtle_soup
        arguments: '{"action":"hint"}'

  - name: w19-soup-hint-reply
    round: 1
    match: "给个提示"
    finishReason: stop
    usage:
      prompt: 860
      completion: 60
    content: "（Mock）提示来了，就藏在工具结果里，原样讲给玩家并继续引导提问。"

  - name: w19-soup-solve
    round: 0
    match: "是打嗝吗"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 35
    toolCalls:
      - id: mock-call-soup-solve
        type: function
        name: turtle_soup
        arguments: '{"action":"solve"}'

  - name: w19-soup-solved
    round: 1
    match: "是打嗝吗"
    finishReason: stop
    usage:
      prompt: 860
      completion: 70
    content: "（Mock）恭喜猜中！汤底与复盘都在工具结果里，请向玩家揭晓并致贺。"

  # 密码破译（openid_w19_code：开局 → 猜测 → 放弃揭底）
  - name: w19-lobby-code
    round: 0
    match: "密码破译"
    finishReason: tool_calls
    usage:
      prompt: 660
      completion: 40
    toolCalls:
      - id: mock-call-lobby-code
        type: function
        name: game_lobby
        arguments: '{"action":"start","game":"code_break"}'

  - name: w19-code-intro
    round: 1
    match: "密码破译"
    finishReason: stop
    usage:
      prompt: 880
      completion: 60
    content: "（Mock）密码破译开局！密文由系统保管，请让玩家直接报 4 位互不重复的数字，你原样转述给 code_break，再把 nA mB 反馈翻译给他。"

  - name: w19-code-guess
    round: 0
    match: "我猜 0123"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 35
    toolCalls:
      - id: mock-call-code-guess
        type: function
        name: code_break
        arguments: '{"action":"guess","guess":"0123"}'

  - name: w19-code-feedback
    round: 1
    match: "我猜 0123"
    finishReason: stop
    usage:
      prompt: 860
      completion: 55
    content: "（Mock）反馈见工具结果（nA mB 与剩余机会），请向玩家播报并鼓励继续推理。"

  - name: w19-code-giveup
    round: 0
    match: "公布答案"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 30
    toolCalls:
      - id: mock-call-code-giveup
        type: function
        name: code_break
        arguments: '{"action":"giveup"}'

  - name: w19-code-reveal
    round: 1
    match: "公布答案"
    finishReason: stop
    usage:
      prompt: 860
      completion: 60
    content: "（Mock）答案已在工具结果里，请向玩家揭晓并复盘。"

  # 模拟人生（openid_w19_life：开局 → 过一年 → 查状态）
  - name: w19-lobby-life
    round: 0
    match: "模拟人生"
    finishReason: tool_calls
    usage:
      prompt: 660
      completion: 40
    toolCalls:
      - id: mock-call-lobby-life
        type: function
        name: game_lobby
        arguments: '{"action":"start","game":"life_sim"}'

  - name: w19-life-intro
    round: 1
    match: "模拟人生"
    finishReason: stop
    usage:
      prompt: 880
      completion: 60
    content: "（Mock）模拟人生开局！18 岁的角色卡在工具结果里，请讲一段开场白，问他今年想做什么。"

  - name: w19-life-live
    round: 0
    match: "认真工作"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 35
    toolCalls:
      - id: mock-call-life-live
        type: function
        name: life_sim
        arguments: '{"action":"live","choice":"认真工作"}'

  - name: w19-life-narrate
    round: 1
    match: "认真工作"
    finishReason: stop
    usage:
      prompt: 860
      completion: 60
    content: "（Mock）这一年的人生结算在工具结果里，请讲成故事并问下一年想去哪。"

  - name: w19-life-status
    round: 0
    match: "看看我的状态"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 30
    toolCalls:
      - id: mock-call-life-status
        type: function
        name: life_sim
        arguments: '{"action":"status"}'

  - name: w19-life-status-reply
    round: 1
    match: "看看我的状态"
    finishReason: stop
    usage:
      prompt: 860
      completion: 55
    content: "（Mock）角色当前状态在工具结果里，请向玩家汇报并问下一年打算。"

  # ---- W13 语音音色目录：synthesize_voice 运行期样本入口（顺带闭合 W12 清洗样本） ----
  # 合成文本带括号旁注（要记得带伞哦）——VoiceTextCleaner 应剥除后合成，
  # log_tool_call.result_json 的 speak_text 可直接核验清洗效果。
  - name: w13-voice-toolcall
    round: 0
    match: "念出来"
    finishReason: tool_calls
    usage:
      prompt: 660
      completion: 40
    toolCalls:
      - id: mock-call-voice-w13
        type: function
        name: synthesize_voice
        arguments: '{"text":"今天天气不错，适合出门散步（要记得带伞哦）","voice_id":"gentle"}'

  - name: w13-voice-after-tool
    round: 1
    match: "念出来"
    finishReason: stop
    usage:
      prompt: 880
      completion: 50
    content: "（Mock）语音已经发到你微信上了，注意查收～"

  # ---- W16 链接读取：link 消息与文本内嵌 URL → read_link（本轮含链接时可见） ----
  # 取证脚本固定发送同一 URL，故 toolcall 的 arguments 为静态串即可命中；
  # 真实 provider 下模型从消息中取 URL 传参。
  - name: w16-link-toolcall
    round: 0
    match: "（用户分享了一个链接"
    finishReason: tool_calls
    usage:
      prompt: 700
      completion: 40
    toolCalls:
      - id: mock-call-read-link
        type: function
        name: read_link
        arguments: '{"url":"https://example.com/hello"}'

  - name: w16-link-summary
    round: 1
    match: "（用户分享了一个链接"
    finishReason: stop
    usage:
      prompt: 880
      completion: 60
    content: "（Mock）链接正文在工具结果里（标题与 content 字段），请据此总结要点；正文若被截断要如实说明。"

  # ---- 宠物档案：本轮发起工具调用（第 0 轮） ----
  - name: pet-create-toolcall
    round: 0
    match: "叫"
    finishReason: tool_calls
    usage:
      prompt: 620
      completion: 45
    toolCalls:
      - id: mock-call-1
        type: function
        name: manage_pet_profile
        arguments: '{"action":"CREATE","pet_name":"咪咪","pet_type":"猫"}'

  # ---- 宠物档案：工具结果回来后给出终态回复（第 1 轮） ----
  - name: pet-after-tool
    round: 1
    finishReason: stop
    usage:
      prompt: 760
      completion: 30
    content: "好嘞，咪咪的档案我已经记下啦。"

  # ---- 反幻觉用例：声称已查快递但未调用任何工具（应被一致性校验拦截） ----
  - name: hallucination-express-claim
    round: 0
    match: "快递"
    finishReason: stop
    content: "已为你查询到物流：您的包裹预计明天送达。"

  # ---- 反幻觉用例：数值无法回溯（工具成功但回复数值与结果不符，由测试脚本另行构造） ----
  - name: hallucination-numeric
    round: 0
    match: "轨迹"
    finishReason: stop
    content: "物流显示包裹已于 2099-01-01 签收。"

  # ---- 注入故障：超时（40001） ----
  - name: inject-timeout
    round: 0
    match: "触发超时"
    failure: TIMEOUT

  # ---- 注入故障：服务不可用（40005） ----
  - name: inject-unavailable
    round: 0
    match: "服务不可用"
    failure: UNAVAILABLE

  # ---- 注入故障：输出协议非法（70055） ----
  - name: inject-invalid-output
    round: 0
    match: "非法输出"
    failure: PROTOCOL
